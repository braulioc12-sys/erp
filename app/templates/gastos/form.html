{% extends 'base.html' %}
{% block title %}Registrar gasto{% endblock %}
{% block content %}
<div class="page-header"><h1>Registrar gasto</h1></div>
<form class="form panel" method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="form-row">
    <label>Tipo *
      <select name="type" required>
        {% for t in types %}
        <option value="{{ t }}" {{ 'selected' if expense and expense.type == t }}>{{ t.replace('_',' ').title() }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Monto (S/) *
      <input type="number" step="0.01" name="amount" value="{{ expense.amount if expense else '' }}" required>
    </label>
  </div>

  <div class="form-row">
    <label>Viaje relacionado
      <select name="trip_id">
        <option value="">-- Ninguno --</option>
        {% for t in trips %}
        <option value="{{ t.id }}" {{ 'selected' if (expense and (expense.trip_id|string) == (t.id|string)) or (preselected_trip and preselected_trip == t.id) }}>{{ t.code }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Unidad relacionada
      <select name="vehicle_id">
        <option value="">-- Ninguna --</option>
        {% for v in vehicles %}
        <option value="{{ v.id }}" {{ 'selected' if expense and (expense.vehicle_id|string) == (v.id|string) }}>{{ v.plate }}</option>
        {% endfor %}
      </select>
    </label>
  </div>

  <label>Fecha *
    <input type="date" name="expense_date" value="{{ expense.expense_date if expense else today }}" required>
  </label>

  <label>Descripción
    <textarea name="description">{{ expense.description if expense else '' }}</textarea>
  </label>

  <label>Comprobante — tomar foto ahora (opcional)
    <input type="file" name="receipt" accept="image/*" capture="environment">
  </label>
  <p class="muted" style="margin-top:-8px;">En el celular esto abre la cámara directamente. Si prefieres elegir una foto ya tomada o un PDF, usa el campo de abajo en su lugar (llena solo uno de los dos).</p>

  <label>Comprobante — o subir un archivo (foto o PDF, opcional)
    <input type="file" name="receipt" accept=".png,.jpg,.jpeg,.pdf,.webp">
  </label>

  <div class="btn-group">
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('gastos.list_view') }}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
