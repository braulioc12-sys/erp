{% extends 'base.html' %}
{% block content_guest %}
<!-- 16 sep: splash de carga con la marca de Harris al entrar al login,
     pedido de Braulio ("podemos hacerle un logo y una animación cuando
     esté cargando?"). Puramente cosmético (SVG inline + CSS, sin
     dependencias) -- se puede saltar con un clic, y no bloquea el
     formulario de abajo (ya está renderizado, solo tapado un instante). -->
<div class="splash-screen" id="harrisSplash" aria-hidden="true">
  <svg class="splash-mark" viewBox="0 0 200 200" width="120" height="120">
    <defs>
      <linearGradient id="splashGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1d4ed8"/>
        <stop offset="1" stop-color="#1737a6"/>
      </linearGradient>
    </defs>
    <rect x="4" y="4" width="192" height="192" rx="42" fill="url(#splashGrad)"/>
    <text x="100" y="122" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="92" fill="#fff" text-anchor="middle" class="splash-h">H</text>
    <path class="splash-route" d="M56 150 L142 150" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="4 9"/>
    <circle class="splash-dot" cx="148" cy="150" r="7" fill="#fff"/>
  </svg>
  <div class="splash-word">{{ system_name }}</div>
</div>
<div class="login-screen">
  <form class="login-card" id="loginForm" method="post">
    <div class="login-brand">
      <img src="{{ url_for('static', filename='img/harris-logo-lockup.png') }}" alt="{{ system_name }}" class="login-brand-logo">
    </div>
    <h1>Iniciar sesión</h1>
    <label>Correo electrónico
      <input type="email" name="email" required autofocus>
    </label>
    <label>Contraseña
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
  </form>
</div>
<script>
  // Splash: se oculta solo tras la animación, o al hacer clic/tocar (para
  // quien no quiera esperar). "hidden" evita que quede un elemento fijo
  // invisible interceptando clics una vez terminó.
  (function () {
    var splash = document.getElementById('harrisSplash');
    if (!splash) return;
    function dismiss() {
      splash.classList.add('splash-hide');
      setTimeout(function () { splash.hidden = true; }, 350);
    }
    splash.addEventListener('click', dismiss);
    setTimeout(dismiss, 1500);
  })();

  // Estado de carga del botón al enviar el login (evita doble envío y da
  // feedback de que sí se está procesando).
  (function () {
    var form = document.getElementById('loginForm');
    if (!form) return;
    form.addEventListener('submit', function () {
      var btn = form.querySelector('button[type="submit"]');
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span> Entrando…';
    });
  })();
</script>
{% endblock %}
