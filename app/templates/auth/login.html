{% extends 'base.html' %}
{% block content_guest %}
<!-- 16 sep: splash de carga con la marca de Harris al entrar al login,
     pedido de Braulio ("podemos hacerle un logo y una animación cuando
     esté cargando?"). Puramente cosmético (CSS, sin dependencias) -- se
     puede saltar con un clic, y no bloquea el formulario de abajo (ya
     está renderizado, solo tapado un instante).

     19 sep: se reemplazó el mark placeholder (un rectángulo con una "H"
     dibujado en SVG, diseñado por la sesión) por el logo real que mandó
     Braulio (harris-logo-mark.png) -- se sacó el trazo punteado/punto
     ("ruta") que acompañaba a la "H" porque era un detalle pensado para
     ese placeholder, no para este logo. -->
<div class="splash-screen" id="harrisSplash" aria-hidden="true">
  <img class="splash-mark" src="{{ url_for('static', filename='img/harris-logo-mark.png') }}" width="120" height="120" alt="">
  <div class="splash-word">{{ system_name }}</div>
</div>
<div class="login-screen">
  <form class="login-card" id="loginForm" method="post">
    <div class="login-brand">
      <img src="{{ url_for('static', filename='img/harris-logo-lockup.png') }}" alt="{{ system_name }}" class="login-brand-logo">
    </div>
    <h1>Iniciar sesión</h1>
    <label>Correo electrónico
      <input type="email" name="email" required autofocus>
    </label>
    <label>Contraseña
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
  </form>
</div>
<script>
  // Splash: se oculta solo tras la animación, o al hacer clic/tocar (para
  // quien no quiera esperar). "hidden" evita que quede un elemento fijo
  // invisible interceptando clics una vez terminó.
  (function () {
    var splash = document.getElementById('harrisSplash');
    if (!splash) return;
    function dismiss() {
      splash.classList.add('splash-hide');
      setTimeout(function () { splash.hidden = true; }, 350);
    }
    splash.addEventListener('click', dismiss);
    setTimeout(dismiss, 1500);
  })();

  // Estado de carga del botón al enviar el login (evita doble envío y da
  // feedback de que sí se está procesando).
  (function () {
    var form = document.getElementById('loginForm');
    if (!form) return;
    form.addEventListener('submit', function () {
      var btn = form.querySelector('button[type="submit"]');
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span> Entrando…';
    });
  })();
</script>
{% endblock %}
