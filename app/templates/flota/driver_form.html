{% extends 'base.html' %}
{% block title %}{{ 'Editar conductor' if mode == 'edit' else 'Nuevo conductor' }}{% endblock %}
{% block content %}
<div class="page-header"><h1>{{ 'Editar conductor' if mode == 'edit' else 'Nuevo conductor' }}</h1></div>
<form class="form panel" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Nombre completo *
    <input type="text" name="name" value="{{ driver.name if driver else '' }}" required>
  </label>
  <div class="form-row">
    <label>DNI
      <input type="text" name="document_number" value="{{ driver.document_number if driver else '' }}" placeholder="Se usa al generar guías de remisión">
    </label>
    <label>N° de licencia
      <input type="text" name="license_number" value="{{ driver.license_number if driver else '' }}">
    </label>
  </div>
  <div class="form-row">
    <label>Vencimiento de licencia
      <input type="date" name="license_expiry" value="{{ driver.license_expiry if driver else '' }}">
    </label>
  </div>
  <div class="form-row">
    <label>Teléfono
      <input type="text" name="phone" value="{{ driver.phone if driver else '' }}">
    </label>
    <label>Estado
      <select name="status">
        {% set current = driver.status if driver else 'ACTIVO' %}
        <option value="ACTIVO" {{ 'selected' if current == 'ACTIVO' }}>Activo</option>
        <option value="INACTIVO" {{ 'selected' if current == 'INACTIVO' }}>Inactivo</option>
      </select>
    </label>
  </div>
  <div class="btn-group">
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('flota.list_view', tab='conductores') }}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
