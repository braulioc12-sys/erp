{% extends 'base.html' %}
{% block title %}{{ 'Editar viaje' if mode == 'edit' else 'Nuevo viaje' }}{% endblock %}
{% block content %}
<div class="page-header"><h1>{{ 'Editar viaje' if mode == 'edit' else 'Nuevo viaje' }}</h1></div>
<form class="form panel" method="post" style="max-width: 760px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label>Cliente *
    <select name="client_id" required>
      <option value="">-- Selecciona un cliente --</option>
      {% for c in clients %}
      <option value="{{ c.id }}" {{ 'selected' if trip and (trip.client_id|string) == (c.id|string) }}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </label>

  <div class="form-row">
    <label>Origen *
      <input type="text" id="trip-origin" name="origin" value="{{ trip.origin if trip else '' }}" required>
    </label>
    <label>Destino *
      <input type="text" id="trip-destination" name="destination" value="{{ trip.destination if trip else '' }}" required>
    </label>
  </div>

  <div class="form-row">
    <label>Unidad asignada
      <select name="vehicle_id">
        <option value="">-- Sin asignar --</option>
        {% for v in vehicles %}
        <option value="{{ v.id }}" {{ 'selected' if trip and (trip.vehicle_id|string) == (v.id|string) }}>{{ v.plate }} ({{ v.brand or '' }} {{ v.model or '' }})</option>
        {% endfor %}
      </select>
    </label>
    <label>Conductor asignado
      <select name="driver_id">
        <option value="">-- Sin asignar --</option>
        {% for d in drivers %}
        <option value="{{ d.id }}" {{ 'selected' if trip and (trip.driver_id|string) == (d.id|string) }}>{{ d.name }}</option>
        {% endfor %}
      </select>
    </label>
  </div>

  <div class="form-row">
    <label>Descripción de la carga
      <input type="text" name="cargo_description" value="{{ trip.cargo_description if trip else '' }}">
    </label>
    <label>Peso (kg)
      <input type="number" step="0.01" name="cargo_weight_kg" value="{{ trip.cargo_weight_kg if trip else '' }}">
    </label>
  </div>

  <div class="form-row">
    <label>Fecha programada *
      <input type="date" name="scheduled_date" value="{{ trip.scheduled_date if trip else today }}" required>
    </label>
    <label>Tarifa (S/)
      <input type="number" step="0.01" name="rate" value="{{ trip.rate if trip else '0' }}">
    </label>
  </div>

  <div class="form-row">
    <label>Comisión del conductor (S/)
      <input type="number" step="0.01" id="trip-commission" name="driver_commission" value="{{ trip.driver_commission if trip and trip.driver_commission is not none else '' }}" placeholder="Se sugiere según la ruta">
    </label>
  </div>
  <p class="muted" id="commission-hint" style="margin-top:-12px;"></p>

  <label>Notas
    <textarea name="notes">{{ trip.notes if trip else '' }}</textarea>
  </label>

  <div class="btn-group">
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('viajes.list_view') }}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>

<script>
  (function () {
    var routes = {{ (routes_for_js or []) | tojson }};
    var origin = document.getElementById('trip-origin');
    var destination = document.getElementById('trip-destination');
    var commission = document.getElementById('trip-commission');
    var hint = document.getElementById('commission-hint');
    var lastSuggested = null;

    function norm(s) { return (s || '').trim().toLowerCase(); }

    function suggest() {
      var o = norm(origin.value), d = norm(destination.value);
      if (!o || !d) { hint.textContent = ''; return; }
      var match = routes.find(function (r) { return norm(r.origin) === o && norm(r.destination) === d; });
      if (!match) { hint.textContent = 'Esta ruta no tiene comisión predeterminada configurada en Rutas.'; return; }
      hint.textContent = 'Comisión sugerida según la ruta: S/ ' + Number(match.default_commission_amount).toFixed(2);
      // Solo autocompletar si el campo está vacío o todavía tiene el último valor sugerido (no lo tocó el usuario).
      if (!commission.value || Number(commission.value) === lastSuggested) {
        commission.value = match.default_commission_amount;
        lastSuggested = match.default_commission_amount;
      }
    }

    origin.addEventListener('blur', suggest);
    destination.addEventListener('blur', suggest);
    if (origin.value && destination.value) { suggest(); }
  })();
</script>
{% endblock %}
